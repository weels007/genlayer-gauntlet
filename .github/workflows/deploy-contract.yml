name: Deploy Contract

# Deploys Gauntlet once with the seeded contest and records the address in
# deployment.json. The brief and rubric are constructor arguments and there is no
# setter, so a change to the contract means a new contest and a new address; a
# push that does not change the contract reuses the recorded deployment.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy again and replace the recorded address"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "contracts/Gauntlet.py"
      - "scripts/deploy.py"
      - "scripts/wallet.py"
      - ".github/workflows/deploy-contract.yml"

permissions:
  contents: write

concurrency:
  group: deploy-contract
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy once and record the address
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Check the wallet secret
        id: secrets
        run: |
          if [ -z "${{ secrets.GAUNTLET_DEPLOYER_KEYSTORE }}" ]; then
            echo "::notice title=Deploy skipped::Add GAUNTLET_DEPLOYER_KEYSTORE and GAUNTLET_DEPLOYER_PASSWORD, then run this workflow again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.secrets.outputs.skip != 'true'
        env:
          GAUNTLET_DEPLOYER_KEYSTORE: ${{ secrets.GAUNTLET_DEPLOYER_KEYSTORE }}
          GAUNTLET_DEPLOYER_PASSWORD: ${{ secrets.GAUNTLET_DEPLOYER_PASSWORD }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/deploy.py --force
          else
            python scripts/deploy.py
          fi

      - name: Record the address
        if: steps.secrets.outputs.skip != 'true'
        run: |
          if [ -f deployment.json ]; then
            {
              echo "### Gauntlet deployment"
              echo '```json'
              cat deployment.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          git add deployment.json
          if git diff --cached --quiet -- deployment.json; then
            echo "No new address to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record the deployed Gauntlet address"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "Could not push the recorded address" >&2
          exit 1
